<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Access</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">Ritesh<span>Masterclass</span></div><a href="index.html">Home</a></header><main><section class="join" style="margin-top:70px"><div><p class="eyebrow">MEMBER AREA</p><h2>Your access</h2><p id="status">Checking your enrollment…</p></div><div id="course" hidden><h2>Welcome 🎓</h2><p>Your payment has been approved. Your course materials can be placed here.</p><a class="btn" href="#">Open class materials</a></div></section></main><script src="config.js"></script><script>const t=localStorage.getItem('student_token');const s=document.querySelector('#status'),c=document.querySelector('#course');if(!t){s.textContent='Your access link is missing or expired. Please return to the home page and verify your email again.'}else fetch(`${window.API_BASE}/api/student/me`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).then(d=>{if(d.approved){s.textContent='Payment approved. Your enrollment is active.';c.hidden=false}else s.textContent='Your payment is still pending admin verification.'}).catch(()=>s.textContent='Could not connect to the server.')</script></body></html>
